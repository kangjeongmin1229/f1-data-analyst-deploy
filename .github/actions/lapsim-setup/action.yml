name: LapSim job setup
description: Node, raw-data cache, the lapsim-prep build (this run's, or a pinned run's) and npm packages
inputs:
  prep-run:
    description: 'Run id whose lapsim-prep artifact to use (empty: this run)'
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Restore raw data cache
      uses: actions/cache/restore@v4
      with:
        path: .cache/lapsim/raw
        key: lapsim-raw-v1-${{ github.run_id }}
        restore-keys: lapsim-raw-v1-
    - if: inputs.prep-run == ''
      uses: actions/download-artifact@v4
      with:
        name: lapsim-prep
        path: /tmp
    - if: inputs.prep-run != ''
      uses: actions/download-artifact@v4
      with:
        name: lapsim-prep
        path: /tmp
        run-id: ${{ inputs.prep-run }}
        repository: ${{ github.repository }}
        github-token: ${{ github.token }}
    - name: Unpack the build
      shell: bash
      run: tar xzf /tmp/lapsim-prep.tgz
    - shell: bash
      run: npm ci --omit=dev --ignore-scripts
    # unseen-season gate (step 3, 2022): .github/lapsim-f1-2022 line 1 = the step-0 file, line 2 = seasons kept as fit inputs (rev 4: 2023); the 2022 laps take the 2025 slot (before the geometry flag)
    - name: Apply the 2022 season inputs (gate branches only)
      shell: bash
      run: f=$(sed -n 1p .github/lapsim-f1-2022 2>/dev/null | tr -d '[:space:]'); w=$(sed -n 2p .github/lapsim-f1-2022 2>/dev/null | tr -d '[:space:]'); [ -z "$f" ] || LAPSIM_F1_2022=on LAPSIM_F1_2022_WITH="$w" node scripts/sim/geom-indep/apply-2022.mjs "$f"
    # gate flag for geometry candidates (step 3): .github/lapsim-geom-indep holds the LAPSIM_GEOM_INDEP value; absent = no change
    - name: Apply the candidate geometry (gate branches only)
      shell: bash
      run: m=$(tr -d '[:space:]' < .github/lapsim-geom-indep 2>/dev/null || true); [ -z "$m" ] || LAPSIM_GEOM_INDEP=$m node scripts/sim/geom-indep/apply.mjs

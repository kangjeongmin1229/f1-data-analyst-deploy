name: probe render map pages
on: {push: {branches: ['probe/fia-docs-render']}}
permissions: {contents: write}
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - run: |
          mkdir out && cd out
          get() { curl -sfL --retry 4 --retry-delay 20 -o "$1.pdf" "$2" && pdftoppm -png -r 110 -f $3 -l $3 "$1.pdf" "$1" && sha256sum "$1.pdf" >> sha.txt; sleep 5; }
          get bah22 'https://www.fia.com/sites/default/files/decision-document/2022%20Bahrain%20-%20Circuit%20Map.pdf' 2
          get can23 'https://www.fia.com/sites/default/files/decision-document/2023%20Canadian%20Grand%20Prix%20-%20Event%20Notes%20-%20Circuit%20Map%2C%20Pit%20Lane%20and%20Red%20Zone.pdf' 2
          get aze25 'https://www.fia.com/system/files/decision-document/2025_azerbaijan_grand_prix_-_event_notes_-_circuit_map_pit_lane_quarantine_zone_and_red_zone.pdf' 3
          rm -f *.pdf; ls -la
          git init -q -b probe/fia-docs-render-out && git add -A && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm render
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/probe/fia-docs-render-out

# Step 27 screens S0 + S8 (central 2026-11-26 07:15, report-only, no attempt): dispatches the five research refits on the screen/* branches,
# at most two at once; one infra retry per run (rerun of the failed jobs when the fit job did not succeed). Each pipeline run publishes
# its own report + calibration to results/screens (run-<id>/). This job writes the run ids to results/screens/screen27-runs.txt.
name: Step 27 screens S0 + S8
on:
  push:
    branches: ['publish/screen-27-2026-11-26']
permissions: {contents: write, actions: write}
concurrency: {group: screen-27, cancel-in-progress: false}
env: {GH_TOKEN: '${{ github.token }}', R: '${{ github.repository }}'}
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - run: |
          note() { echo "$(date -u +%FT%H:%MZ) $*" | tee -a log.txt; d=$(mktemp -d); git clone -q --depth 1 -b results/screens https://x-access-token:${GH_TOKEN}@github.com/$R.git $d 2>/dev/null || { git init -q -b results/screens $d; git -C $d remote add origin https://x-access-token:${GH_TOKEN}@github.com/$R.git; }
            cp log.txt $d/screen27-runs.txt; git -C $d -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com add -A; git -C $d -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -q -m "screen 27 runs" && git -C $d push -q origin HEAD:results/screens || echo "log push failed"; rm -rf $d; }
          go() { gh workflow run lapsim-pipeline.yml -R $R --ref "$1" -f mode=research -f fit=yes -f wec_only="$2"; sleep 45; gh run list -R $R -w lapsim-pipeline.yml -b "$1" -L 1 --json databaseId -q '.[0].databaseId'; }
          st() { gh run view $1 -R $R --json status -q .status; }
          fitok() { gh run view $1 -R $R --json jobs -q '[.jobs[]|select(.name=="fit")|.conclusion][0]'; }
          Q="S0-F1:screen/f1-base-2026-11-26:no S0-WEC:screen/wec-base-2026-11-26:yes S8-0.60:screen/s8-mu060-2026-11-26:no S8-0.80:screen/s8-mu080-2026-11-26:no S8-0.90:screen/s8-mu090-2026-11-26:no"
          declare -A RUN RETRY; running=(); : > log.txt
          for item in $Q; do
            while [ ${#running[@]} -ge 2 ]; do sleep 120; keep=()
              for k in "${running[@]}"; do id=${RUN[$k]}
                if [ "$(st $id)" = completed ]; then f=$(fitok $id)
                  if [ "$f" != success ] && [ -z "${RETRY[$k]}" ]; then RETRY[$k]=1; gh run rerun $id -R $R --failed && { note "$k $id fit=$f: retry once (infra)"; keep+=("$k"); continue; } || note "$k $id rerun refused"; fi
                  note "$k $id done fit=$f conclusion=$(gh run view $id -R $R --json conclusion -q .conclusion)"; else keep+=("$k"); fi; done
              running=("${keep[@]}"); done
            k=${item%%:*}; rest=${item#*:}; ref=${rest%:*}; w=${rest##*:}; id=$(go $ref $w); RUN[$k]=$id; running+=("$k"); note "$k dispatched $id ref $ref wec_only=$w"
          done
          for i in $(seq 1 150); do keep=(); for k in "${running[@]}"; do id=${RUN[$k]}; if [ "$(st $id)" = completed ]; then f=$(fitok $id)
                if [ "$f" != success ] && [ -z "${RETRY[$k]}" ]; then RETRY[$k]=1; gh run rerun $id -R $R --failed && { note "$k $id fit=$f: retry once (infra)"; keep+=("$k"); continue; }; fi
                note "$k $id done fit=$f conclusion=$(gh run view $id -R $R --json conclusion -q .conclusion)"; else keep+=("$k"); fi; done
            running=("${keep[@]}"); [ ${#running[@]} = 0 ] && break; sleep 120; done
          note "dispatcher end; still running: ${running[*]}"

name: Probe track temperature with Timing71
on:
  push:
    branches: ['probe/t71-temp']
permissions:
  contents: write
jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: mkdir -p probe-out && LAPSIM_T71_DIR=.t71 node scripts/sim/tracktemp-fit.mjs | tail -40 | tee probe-out/tracktemp.txt
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -f probe-out worker/lapsim/tracktemp-data.js scripts/sim/data/tracktemp.json && git commit -m "track temp probe result" && git push

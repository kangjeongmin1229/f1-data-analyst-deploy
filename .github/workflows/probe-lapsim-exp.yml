name: Probe lapsim experiments
# Runs calibrate.mjs variants listed in probe-exp.json on the inputs exported to probe/lapsim-export.
on:
  push:
    branches: ['probe/lapsim-exp']
    paths-ignore: ['probe-out/**']
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      m: ${{ steps.m.outputs.m }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "m=$(jq -c . probe-exp.json)" >> "$GITHUB_OUTPUT"
  exp:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.m) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev --ignore-scripts
      - name: Inputs
        run: |
          git fetch --depth 1 origin probe/lapsim-export
          mkdir -p /tmp/in && git --work-tree=/tmp/in checkout FETCH_HEAD -- probe-out
          cat /tmp/in/probe-out/lapsim-inputs.tgz.part-* | tar xzf -
          ls -la .cache/lapsim
      - name: Calibrate
        run: |
          export LAPSIM_FITTER=bcd LAPSIM_ROUNDS=5 LAPSIM_BCD_ITERS=200 LAPSIM_WTIME=20 LAPSIM_WSECTOR=2 LAPSIM_TEAMS=on LAPSIM_WPRIOR=8
          for kv in $(echo '${{ toJSON(matrix.env) }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"'); do export "$kv"; done
          env | grep ^LAPSIM_ | sort
          node scripts/sim/calibrate.mjs > /tmp/cal.log 2>&1 || (tail -50 /tmp/cal.log; exit 1)
          grep -E "WARNING|holdout|rejected|accepted" /tmp/cal.log | tail -60 || true
          node scripts/sim/exp-summary.mjs ${{ matrix.name }}
          cp worker/lapsim/calibration-data.js probe-out/cal-${{ matrix.name }}.js
          tail -200 /tmp/cal.log > probe-out/log-${{ matrix.name }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: exp-${{ matrix.name }}
          path: probe-out
  collect:
    needs: exp
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: exp-*
          path: probe-out
          merge-multiple: true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -f probe-out && git commit -m "experiment results" && git push

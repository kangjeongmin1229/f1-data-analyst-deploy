name: Lap simulator experiment

# Step 2a attempt 2 (claude/gate-cda-measured-prereg-2026-11-23-amendment-a2.md): one build (the `lapsim-prep` artifact of the shared
# base run, experiments.json base_run; its calibration is the base), then every candidate of scripts/sim/experiments.json calibrates on that same build with production
# settings, followed by level C, forward-chaining and validate; the compare job runs the pre-registered gate. Push to lapsim-exp/**.
on:
  push:
    branches: ['lapsim-exp/**']
    paths-ignore: ['docs/experiments/**']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: lapsim-experiment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.p.outputs.configs }}
      common_env: ${{ steps.p.outputs.common_env }}
      base_run: ${{ steps.p.outputs.base_run }}
      base_commit: ${{ steps.p.outputs.base_commit }}
      cand_run: ${{ steps.p.outputs.cand_run }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          echo "configs=$(jq -c '.configs' scripts/sim/experiments.json)" >> "$GITHUB_OUTPUT"
          echo "common_env=$(jq -c '.common_env' scripts/sim/experiments.json)" >> "$GITHUB_OUTPUT"
          echo "base_run=$(jq -r '.base_run' scripts/sim/experiments.json)" >> "$GITHUB_OUTPUT"
          echo "base_commit=$(jq -r '.base_commit // ""' scripts/sim/experiments.json)" >> "$GITHUB_OUTPUT"
          echo "cand_run=$(jq -r '.cand_run // ""' scripts/sim/experiments.json)" >> "$GITHUB_OUTPUT"
  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.plan.outputs.configs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # one build for base and candidates: the shared base run's lapsim-prep (central rule v2, item 6)
      - uses: actions/download-artifact@v4
        with:
          name: lapsim-prep
          path: /tmp
          run-id: ${{ needs.plan.outputs.base_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # base calibration = the one the shared base run committed (bot commit, experiments.json base_commit)
      - name: Base calibration from the base run's commit
        if: matrix.config.name == 'base'
        run: |
          git fetch --no-tags --depth=1 origin '${{ needs.plan.outputs.base_commit }}' || git fetch --no-tags origin 'refs/heads/lapsim/gate-w2-base-2026-11-24'
          mkdir -p /tmp/base-cal/worker/lapsim && git show '${{ needs.plan.outputs.base_commit }}:worker/lapsim/calibration-data.js' > /tmp/base-cal/worker/lapsim/calibration-data.js
      - name: Unpack the build
        run: tar xzf /tmp/lapsim-prep.tgz
      - run: npm ci --omit=dev --ignore-scripts
      - name: Read FIA energy documents and regulation values
        continue-on-error: true
        run: node scripts/sim/energy-docs.mjs && node scripts/sim/rule-params.mjs
      - name: Calibrate (${{ matrix.config.name }}) and reports
        run: |
          for kv in $(echo '${{ needs.plan.outputs.common_env }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"'); do export "$kv"; done
          for kv in $(echo '${{ toJson(matrix.config.env) }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"'); do export "$kv"; done
          env | grep '^LAPSIM_' | sort
          mkdir -p probe-out
          if [ '${{ matrix.config.name }}' = base ]; then
            cp /tmp/base-cal/worker/lapsim/calibration-data.js worker/lapsim/calibration-data.js && echo "base: calibration of run ${{ needs.plan.outputs.base_run }}" > /tmp/calibrate.log
          else
            node scripts/sim/calibrate.mjs 2>&1 | tee /tmp/calibrate.log
          fi
          cp worker/lapsim/calibration-data.js 'probe-out/cal-${{ matrix.config.name }}.js'
          cp /tmp/calibrate.log 'probe-out/log-${{ matrix.config.name }}.txt'
          node scripts/sim/holdout-track.mjs --json 'probe-out/levelc-${{ matrix.config.name }}.json' > /dev/null || true
          node scripts/sim/backtest-forward.mjs --json 'probe-out/forward-${{ matrix.config.name }}.json' > /dev/null || true
          node scripts/sim/validate.mjs '${{ matrix.config.name }}' > /tmp/validate-summary.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp-${{ matrix.config.name }}
          path: |
            probe-out/
            docs/lapsim-report.md
          retention-days: 14
      # outputs on the branch too (as step 13 does), so nobody needs an artifact download
      - name: Commit outputs to the branch
        if: always()
        run: |
          d='docs/experiments/step2a-a2/${{ matrix.config.name }}'; mkdir -p "$d"
          cp probe-out/validate-*.json probe-out/levelc-*.json probe-out/forward-*.json "$d"/ 2>/dev/null || true
          tail -c 200000 probe-out/log-*.txt > "$d/calibrate-log-tail.txt" 2>/dev/null || true
          [ '${{ matrix.config.name }}' = base ] || cp probe-out/cal-*.js "$d"/ 2>/dev/null || true
          git config user.name 'kongboda-lapsim[bot]'; git config user.email 'lapsim@users.noreply.github.com'
          git add "$d"; git diff --cached --quiet && exit 0
          git commit -qm "Step 2a a2 experiment outputs: ${{ matrix.config.name }} (run ${{ github.run_id }})"
          for i in 1 2 3 4 5; do git pull -q --rebase --autostash origin '${{ github.ref_name }}' && git push -q origin 'HEAD:${{ github.ref_name }}' && exit 0; sleep $((i*7)); done; exit 1
  compare:
    needs: [plan, run]
    if: always() && needs.run.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: exp-*
          path: results
      # candidates calibrated in an earlier run of this experiment (the base's calibration came later)
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.cand_run != ''
        with:
          pattern: exp-*
          path: results
          run-id: ${{ needs.plan.outputs.cand_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Step 2a attempt 2 gate (VD2 vs base; R10 reported)
        run: |
          mkdir -p comparison; ls results
          [ -d results/exp-base ] && [ -d results/exp-VD2 ] || { echo "base or VD2 not in this run yet"; exit 0; }
          node scripts/sim/cda-gate.mjs results/exp-base/probe-out results/exp-VD2/probe-out results/exp-R10/probe-out | tee comparison/cda-gate.json
      - uses: actions/upload-artifact@v4
        with:
          name: exp-comparison
          path: comparison/
          retention-days: 14
      - name: Commit the gate result to the branch
        run: |
          [ -s comparison/cda-gate.json ] || exit 0
          d=docs/experiments/step2a-a2; mkdir -p "$d"; cp comparison/cda-gate.json "$d/"
          git config user.name 'kongboda-lapsim[bot]'; git config user.email 'lapsim@users.noreply.github.com'
          git add "$d"; git diff --cached --quiet && exit 0
          git commit -qm "Step 2a a2 gate result (run ${{ github.run_id }})"
          for i in 1 2 3 4 5; do git pull -q --rebase --autostash origin '${{ github.ref_name }}' && git push -q origin 'HEAD:${{ github.ref_name }}' && exit 0; sleep $((i*7)); done; exit 1

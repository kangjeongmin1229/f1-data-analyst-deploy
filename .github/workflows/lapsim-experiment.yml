name: Lap simulator experiment

# Step 2a attempt 2 (claude/gate-cda-measured-prereg-2026-11-23-amendment-a2.md): one build (the `lapsim-prep` artifact of the shared
# base run, experiments.json base_run; its calibration is the base), then every candidate of scripts/sim/experiments.json calibrates on that same build with production
# settings, followed by level C, forward-chaining and validate; the compare job runs the pre-registered gate. Push to lapsim-exp/**.
on:
  push:
    branches: ['lapsim-exp/**']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: lapsim-experiment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.p.outputs.configs }}
      common_env: ${{ steps.p.outputs.common_env }}
      base_run: ${{ steps.p.outputs.base_run }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          echo "configs=$(jq -c '.configs' scripts/sim/experiments.json)" >> "$GITHUB_OUTPUT"
          echo "common_env=$(jq -c '.common_env' scripts/sim/experiments.json)" >> "$GITHUB_OUTPUT"
          echo "base_run=$(jq -r '.base_run' scripts/sim/experiments.json)" >> "$GITHUB_OUTPUT"
  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.plan.outputs.configs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # one build for base and candidates: the shared base run's lapsim-prep (central rule v2, item 6)
      - uses: actions/download-artifact@v4
        with:
          name: lapsim-prep
          path: /tmp
          run-id: ${{ needs.plan.outputs.base_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        if: matrix.config.name == 'base'
        with:
          name: calibration-output
          path: /tmp/base-cal
          run-id: ${{ needs.plan.outputs.base_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Unpack the build
        run: tar xzf /tmp/lapsim-prep.tgz
      - run: npm ci --omit=dev --ignore-scripts
      - name: Read FIA energy documents and regulation values
        continue-on-error: true
        run: node scripts/sim/energy-docs.mjs && node scripts/sim/rule-params.mjs
      - name: Calibrate (${{ matrix.config.name }}) and reports
        run: |
          for kv in $(echo '${{ needs.plan.outputs.common_env }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"'); do export "$kv"; done
          for kv in $(echo '${{ toJson(matrix.config.env) }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"'); do export "$kv"; done
          env | grep '^LAPSIM_' | sort
          mkdir -p probe-out
          if [ '${{ matrix.config.name }}' = base ]; then
            cp /tmp/base-cal/worker/lapsim/calibration-data.js worker/lapsim/calibration-data.js && echo "base: calibration of run ${{ needs.plan.outputs.base_run }}" > /tmp/calibrate.log
          else
            node scripts/sim/calibrate.mjs 2>&1 | tee /tmp/calibrate.log
          fi
          cp worker/lapsim/calibration-data.js 'probe-out/cal-${{ matrix.config.name }}.js'
          cp /tmp/calibrate.log 'probe-out/log-${{ matrix.config.name }}.txt'
          node scripts/sim/holdout-track.mjs --json 'probe-out/levelc-${{ matrix.config.name }}.json' > /dev/null || true
          node scripts/sim/backtest-forward.mjs --json 'probe-out/forward-${{ matrix.config.name }}.json' > /dev/null || true
          node scripts/sim/validate.mjs '${{ matrix.config.name }}' > /tmp/validate-summary.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp-${{ matrix.config.name }}
          path: |
            probe-out/
            docs/lapsim-report.md
          retention-days: 14
  compare:
    needs: run
    if: always() && needs.run.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: exp-*
          path: results
      - name: Step 2a attempt 2 gate (VD2 vs base; R10 reported)
        run: |
          mkdir -p comparison
          node scripts/sim/cda-gate.mjs results/exp-base/probe-out results/exp-VD2/probe-out results/exp-R10/probe-out | tee comparison/cda-gate.json
      - uses: actions/upload-artifact@v4
        with:
          name: exp-comparison
          path: comparison/
          retention-days: 14

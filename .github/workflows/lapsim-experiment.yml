name: Lap simulator experiment

# Calibration experiments in parallel: each matrix entry runs calibrate.mjs with its own settings on
# a checksum-pinned input archive. Push to lapsim-exp/**.
# Settings: scripts/sim/experiments.json (input URL/checksum, common env, and variant env).
on:
  push:
    branches: ['lapsim-exp/**']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: lapsim-experiment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.p.outputs.configs }}
      input_url: ${{ steps.p.outputs.input_url }}
      input_sha256: ${{ steps.p.outputs.input_sha256 }}
      common_env: ${{ steps.p.outputs.common_env }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          echo "configs=$(jq -c '.configs' scripts/sim/experiments.json)" >> "$GITHUB_OUTPUT"
          echo "input_url=$(jq -r '.input_url' scripts/sim/experiments.json)" >> "$GITHUB_OUTPUT"
          echo "input_sha256=$(jq -r '.input_sha256' scripts/sim/experiments.json)" >> "$GITHUB_OUTPUT"
          echo "common_env=$(jq -c '.common_env' scripts/sim/experiments.json)" >> "$GITHUB_OUTPUT"
  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.plan.outputs.configs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Get checksum-pinned inputs
        run: |
          curl --fail --location --retry 3 '${{ needs.plan.outputs.input_url }}' --output /tmp/lapsim-inputs.tgz
          echo '${{ needs.plan.outputs.input_sha256 }}  /tmp/lapsim-inputs.tgz' | sha256sum --check
          tar xzf /tmp/lapsim-inputs.tgz
          node -e "const fs=require('fs');const W=JSON.parse(fs.readFileSync('scripts/sim/data/wet-sessions.json','utf8')).wec;const p='.cache/lapsim/wec.json';const rows=JSON.parse(fs.readFileSync(p,'utf8'));let n=0;for(const row of rows)if(row.weather&&W[row.year+' '+row.track]){row.weather.rain=true;n++}fs.writeFileSync(p,JSON.stringify(rows));console.log('wet sessions marked:',n)"
      - name: Calibrate (${{ matrix.config.name }})
        run: |
          for kv in $(echo '${{ needs.plan.outputs.common_env }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"'); do export "$kv"; done
          for kv in $(echo '${{ toJson(matrix.config.env) }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"'); do export "$kv"; done
          env | grep '^LAPSIM_' | sort
          node scripts/sim/calibrate.mjs 2>&1 | tee /tmp/calibrate.log
          node scripts/sim/exp-summary.mjs '${{ matrix.config.name }}'
          node scripts/sim/validate.mjs '${{ matrix.config.name }}' > /tmp/validate-summary.json
          node scripts/sim/intervals.mjs "$PWD/worker/lapsim/calibration-data.js" > 'probe-out/intervals-${{ matrix.config.name }}.json'
          cp worker/lapsim/calibration-data.js 'probe-out/cal-${{ matrix.config.name }}.js'
          cp /tmp/calibrate.log 'probe-out/log-${{ matrix.config.name }}.txt'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp-${{ matrix.config.name }}
          path: |
            probe-out/
            docs/lapsim-report.md
          retention-days: 14

  compare:
    needs: run
    if: always() && needs.run.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: exp-*
          path: results
      - name: Compare every variant with the first one (the baseline)
        run: |
          mkdir -p comparison
          names=$(jq -r '.configs[].name' scripts/sim/experiments.json)
          files=""; for n in $names; do files="$files results/exp-$n/probe-out/cal-$n.js"; done
          node scripts/sim/exp-compare.mjs $files | tee comparison/compare.txt
          pfiles=""; for n in $names; do pfiles="$pfiles results/exp-$n/probe-out/cal-$n.js results/exp-$n/probe-out/validate-$n.json"; done
          node scripts/sim/exp-compare.mjs --physics $pfiles | tee comparison/compare-physics.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: exp-comparison
          path: comparison/
          retention-days: 14

name: Formula E duel sector rows (step 35)

# Central 78/100: no YouTube audio (terms of service, copyright); the sound-speed method is closed as "not available: no licensed
# audio source". This job only fetches the official duel analysis PDFs and keeps the parsed lap rows (car, lap, time, S1-S3);
# no PDF and no text lines are stored (copyright notice). It also removes the earlier asset that held text lines.
on:
  workflow_dispatch:
  push:
    branches: ['fe-fetch/sound**']

permissions:
  contents: write

jobs:
  sectors:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --silent && sudo apt-get install -y -qq poppler-utils >/dev/null
      - run: node scripts/sim/learn/fetch-fe-duel-pdfs.mjs --selftest && FE_SEASONS="Season (9|10|11|12)" node scripts/sim/learn/fetch-fe-duel-pdfs.mjs
      - name: Store parsed rows, remove the text-line asset
        run: |
          id=${{ github.run_id }}
          node -e "const j=require('./fe-duel-analysis.json');if(j.files.some(f=>f.lines))process.exit(1)"
          gzip -c fe-duel-analysis.json > fe-duel-rows-r$id.json.gz; sha256sum fe-duel-rows-r$id.json.gz > SHA256SUMS-duel-r$id
          gh release view fe-inputs-sound >/dev/null 2>&1 || gh release create fe-inputs-sound --prerelease --title "Formula E duel sector rows (step 35)" --notes "Parsed lap rows only; no audio, no PDFs, no text."
          gh release edit fe-inputs-sound --title "Formula E duel sector rows (step 35)" --notes "Parsed lap rows (car, lap, time, S1-S3) from the Al Kamel duel analysis PDFs; no audio, no PDFs, no text. The r45521661514 asset with text lines was deleted (copyright notice)."
          for a in fe-sound-r45521661514.tgz SHA256SUMS-sound-r45521661514; do gh release delete-asset fe-inputs-sound "$a" -y || true; done
          gh release upload fe-inputs-sound fe-duel-rows-r$id.json.gz SHA256SUMS-duel-r$id --clobber
          echo "::notice title=FE duel rows::$(node -p "const j=require('./fe-duel-analysis.json');j.files.length+' PDFs, '+j.files.reduce((s,f)=>s+f.rows.length,0)+' rows, '+j.log.length+' errors'")"
          echo "::notice title=FE assets::$(gh release view fe-inputs-sound --json assets -q '[.assets[].name]|join(\" \")')"

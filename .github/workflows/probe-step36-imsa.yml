name: probe step36 IMSA full laps (fork research copy)
# Research only (step 36 round 3): adds every IMSA WeatherTech event 2023-25 (practice + qualifying files) to the fork's draft
# data-alkamel-full-laps, same fetcher as alkamel-full-laps.yml, and publishes the new manifest for review. Never merged.
on:
  push:
    branches: ['probe/step36-imsa-laps']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts
      - run: |
          set -euo pipefail
          id=$(gh api "repos/$R/releases?per_page=100" -q '.[] | select(.tag_name=="data-alkamel-full-laps") | .assets[] | select(.name=="alkamel-full-laps.tar") | .id' | head -1)
          mkdir -p .cache && gh api -H 'Accept: application/octet-stream' "repos/$R/releases/assets/$id" > .cache/alkamel-full-laps.tar && tar -xf .cache/alkamel-full-laps.tar -C .cache
          node scripts/sim/noise-floor.mjs --check-alkamel .cache/alkamel-full-laps
          node scripts/sim/learn/fetch-alkamel-full-laps.mjs --years=2023,2024,2025 --series=imsa --imsa=all | tail -40
          node scripts/sim/noise-floor.mjs --check-alkamel .cache/alkamel-full-laps
          (cd .cache && find alkamel-full-laps -type f | LC_ALL=C sort | tar --sort=name --mtime='2026-11-23 00:00Z' --owner=0 --group=0 --numeric-owner -cf alkamel-full-laps.tar -T -)
          sha256sum .cache/alkamel-full-laps.tar scripts/sim/data/learn/alkamel-full-laps-manifest.json | tee sums.txt
          rid=$(gh api "repos/$R/releases?per_page=100" -q '.[] | select(.tag_name=="data-alkamel-full-laps") | .id' | head -1)
          gh api -X DELETE "repos/$R/releases/assets/$id"
          gh api -X POST -H 'Content-Type: application/x-tar' "https://uploads.github.com/repos/$R/releases/$rid/assets?name=alkamel-full-laps.tar" --input .cache/alkamel-full-laps.tar > /dev/null
          gh release create step36-imsa-manifest -R "$R" --prerelease --title "step 36 IMSA manifest (research)" --notes "manifest after adding IMSA events" 2>/dev/null || true
          cp docs/lapsim-alkamel-laps.md coverage.md
          gh release upload step36-imsa-manifest -R "$R" scripts/sim/data/learn/alkamel-full-laps-manifest.json sums.txt coverage.md --clobber

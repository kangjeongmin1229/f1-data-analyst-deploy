name: Probe F1 pit lane speed limits
on:
  push:
    branches: ['probe/f1-pit-speed']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev --ignore-scripts
      - run: node scripts/sim/learn/fetch-f1-pit-speed.mjs 2024,2025,2026
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -f scripts/sim/data/learn/f1-pit-speed-raw.json && git commit -m "F1 pit lane speed limits from FIA notes" && git push

name: Lap simulator data

# Rebuilds the lap simulator's tracks and car calibration from OpenF1 qualifying data (F1) and
# Al Kamel published timing (WEC).
# Raw OpenF1/MultiViewer responses stay in the Actions cache; only derived geometry, fitted
# parameters and the report are committed (worker/lapsim/*-data.js, docs/lapsim-report.md).
# - push to a lapsim/** branch: rebuild and commit back to that branch
# - weekly schedule (upstream only) or manual run: rebuild and push a lapsim/refresh-* branch
on:
  push:
    branches: ['lapsim/**']
    paths-ignore: ['worker/lapsim/tracks-data.js', 'worker/lapsim/calibration-data.js', 'worker/lapsim/track-changes-data.js', 'docs/lapsim-report.md', 'docs/lapsim-geometry.md']
  schedule:
    - cron: '17 3 * * 2' # Tuesday 12:17 Korea time, after the race weekend
  workflow_dispatch:
    inputs:
      years:
        description: 'Seasons to fetch (comma separated)'
        required: false
        default: '2023,2024,2025,2026'
      trace_drivers:
        description: 'Fastest drivers per qualifying session whose speed trace is used'
        required: false
        default: '10'
      calibrate:
        description: 'Calibrate and commit (false: only build data and upload it as an artifact)'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: lapsim-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.event_name != 'schedule' || github.repository == 'MisterKinn/f1-data-analyst'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore raw data cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/lapsim/raw
          key: lapsim-raw-v1-${{ github.run_id }}
          restore-keys: lapsim-raw-v1-
      - name: Fetch OpenF1 qualifying data
        timeout-minutes: 150
        env:
          LAPSIM_TRACE_DRIVERS: ${{ inputs.trace_drivers || '10' }}
        run: node scripts/sim/fetch-openf1.mjs "${{ inputs.years || '2023,2024,2025,2026' }}"
      # saved even when a later step fails, so a rerun does not fetch everything again
      - name: Save raw data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/lapsim/raw
          key: lapsim-raw-v1-${{ github.run_id }}
      - name: Choose track smoothing and build tracks
        run: node scripts/sim/tune-geometry.mjs
      - run: npm ci --omit=dev --ignore-scripts
      - name: Fetch WEC timing (Al Kamel)
        run: node scripts/sim/fetch-wec.mjs
      # derived speed traces and tracks for local calibration experiments (not committed)
      - name: Upload derived data
        uses: actions/upload-artifact@v4
        with:
          name: lapsim-derived
          path: |
            .cache/lapsim/traces.json
            .cache/lapsim/wec.json
            .cache/lapsim/races.json
            .cache/lapsim/races/
            worker/lapsim/tracks-data.js
          retention-days: 5
          include-hidden-files: true
      # official recharge limits (FIA PU documents) and 2027/28 + FE Gen4 rule values feed the fit
      - name: Read FIA energy documents and regulation values
        continue-on-error: true
        run: node scripts/sim/energy-docs.mjs && node scripts/sim/rule-params.mjs
      - name: Calibrate cars (F1 and WEC)
        if: inputs.calibrate != 'false'
        run: node scripts/sim/calibrate.mjs
      - name: Fit race pace (fuel, tyres, pit loss)
        continue-on-error: true
        run: node scripts/sim/race-pace.mjs
      - name: Read FIA circuit changes
        if: inputs.calibrate != 'false'
        run: node scripts/sim/fia-changes.mjs
        env:
          LAPSIM_CHANGE_YEARS: '2023,2024,2025,2026'
      - name: Learn circuit-change effects (kerbs, resurfacing) from speed traces
        if: inputs.calibrate != 'false'
        continue-on-error: true
        run: node scripts/sim/change-effects.mjs
      - name: Test
        if: inputs.calibrate != 'false'
        run: node --test tests/lapsim*.test.mjs
      - name: Commit derived data
        if: inputs.calibrate != 'false'
        run: |
          git config user.name "kongboda-lapsim[bot]"
          git config user.email "lapsim@users.noreply.github.com"
          for f in worker/lapsim/tracks-data.js worker/lapsim/calibration-data.js worker/lapsim/track-changes-data.js docs/lapsim-report.md docs/lapsim-geometry.md \
            worker/lapsim/race-data.js docs/lapsim-race.md worker/lapsim/change-effects-data.js worker/lapsim/energy-docs-data.js worker/lapsim/rules-data.js docs/lapsim-rules.md; do
            [ -e "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Rebuild lap simulator tracks and calibration"
          if [ "${{ github.event_name }}" = "push" ]; then
            # the branch may have moved while this ran: replay the data commit on top
            git push origin HEAD:${{ github.ref_name }} || { git fetch origin ${{ github.ref_name }} && git rebase FETCH_HEAD && git push origin HEAD:${{ github.ref_name }}; }
          else
            branch="lapsim/refresh-$(date -u +%Y%m%d)"
            git push origin HEAD:refs/heads/$branch
            echo "Pushed $branch; open a pull request to publish." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Summary
        if: always()
        run: cat docs/lapsim-report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

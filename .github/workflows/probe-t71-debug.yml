name: Probe Timing71 debug
on:
  push:
    branches: ['probe/t71-debug']
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/sim/t71-collect.mjs || true
        env:
          T71_MATCH: '^(Silverstone qualifying 2|Roar Before The 24 - Qualifying|4 Hours of Monza - Qualifying - LMGTE|Northeast Grand Prix - Qualifying|Round 6 - Sanya ePrix - Qualifying Group 1|Round 1 - Diriyah ePrix - Qualifying Group 2)$'
      - run: |
          mkdir -p probe-out && cp .cache/lapsim/t71/log-0.json probe-out/ && ls .cache/lapsim/t71/sessions > probe-out/ok.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -f probe-out && git commit -m "Timing71 debug result" && git push

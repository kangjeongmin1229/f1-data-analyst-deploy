name: Owner lap-time continuation
on:
  push:
    branches: ['lapsim-resume/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: owner-lapsim-${{ github.ref }}
  cancel-in-progress: true
jobs:
  handoff:
    if: github.repository == 'kangjeongmin1229/f1-data-analyst-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preserve earlier active continuation
        run: |
          echo "Duplicate run superseded. Continue existing F1/WEC run 42913368752, sector recovery 42913698920, and checkpoint export 42914814278." >> "$GITHUB_STEP_SUMMARY"
          echo "No new fits or production changes. Saved checkpoints remain on PR #154 branch." >> "$GITHUB_STEP_SUMMARY"

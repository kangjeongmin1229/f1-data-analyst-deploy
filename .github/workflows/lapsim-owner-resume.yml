name: Owner lap-time continuation
on:
  push:
    branches: ['lapsim-resume/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: owner-lapsim-${{ github.ref }}
  cancel-in-progress: false
jobs:
  f1:
    if: github.repository == 'kangjeongmin1229/f1-data-analyst-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arm: control, year: 2025, fold: 3}
          - {arm: control, year: 2026, fold: 0}
          - {arm: control, year: 2026, fold: 1}
          - {arm: control, year: 2026, fold: 2}
          - {arm: control, year: 2026, fold: 3}
          - {arm: candidate, year: 2025, fold: 3}
          - {arm: candidate, year: 2026, fold: 0}
          - {arm: candidate, year: 2026, fold: 1}
          - {arm: candidate, year: 2026, fold: 2}
          - {arm: candidate, year: 2026, fold: 3}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify pinned downloads
        run: node scripts/sim/fetch-owner-inputs.mjs
      - name: Resume one held-out fold
        run: |
          set -euo pipefail
          mkdir -p owner-output
          node scripts/sim/owner-f1-actions.mjs fold '${{ matrix.arm }}' '${{ matrix.year }}' '${{ matrix.fold }}' 2>&1 | tee owner-output/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f1-${{ matrix.arm }}-${{ matrix.year }}-${{ matrix.fold }}
          path: owner-output/
          retention-days: 30
      - name: Stop the workflow on an integrity hard stop
        if: failure() && hashFiles('owner-output/HARD_STOP') != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.cancelWorkflowRun({...context.repo, run_id: context.runId});

  wec:
    if: github.repository == 'kangjeongmin1229/f1-data-analyst-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: {arm: [control, bop, sector2]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify pinned downloads
        run: node scripts/sim/fetch-owner-inputs.mjs
      - name: Run independent WEC arm at R
        run: |
          set -euo pipefail
          mkdir -p owner-output
          node scripts/sim/owner-f1-actions.mjs wec '${{ matrix.arm }}' 2>&1 | tee owner-output/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wec-${{ matrix.arm }}
          path: owner-output/
          retention-days: 30
      - name: Stop the workflow on an integrity hard stop
        if: failure() && hashFiles('owner-output/HARD_STOP') != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.cancelWorkflowRun({...context.repo, run_id: context.runId});

  wec-report:
    needs: [wec]
    if: always() && !cancelled() && github.repository == 'kangjeongmin1229/f1-data-analyst-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with: {pattern: 'wec-*', path: '.cache/action-artifacts'}
      - name: Report Block 3 independently
        run: |
          node scripts/sim/owner-wec-summary.mjs
          cat owner-wec-summary/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-wec-summary
          path: owner-wec-summary/
          retention-days: 30
      - name: Save Block 3 without waiting for F1
        if: success()
        run: |
          set -euo pipefail
          tar czf /tmp/wec-results.tgz -C owner-wec-summary .
          cp owner-wec-summary/report.md /tmp/wec-report.md
          git fetch origin feat/lapsim-wec-timing
          git checkout -B owner-wec-save FETCH_HEAD
          report_dir="scripts/sim/results/owner-actions-2026-11-11/${GITHUB_RUN_ID}/wec-confirmation"
          mkdir -p "$report_dir"
          cp /tmp/wec-results.tgz "$report_dir/results.tar.gz"
          cp /tmp/wec-report.md "$report_dir/README.md"
          sha256sum "$report_dir/results.tar.gz" > "$report_dir/SHA256SUMS"
          cp /tmp/wec-report.md docs/lapsim-owner-wec-confirmation-2026-11-11.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$report_dir" docs/lapsim-owner-wec-confirmation-2026-11-11.md
          git commit -m "Save independent WEC confirmation ${GITHUB_RUN_ID}"
          git push origin HEAD:feat/lapsim-wec-timing || { git pull --rebase origin feat/lapsim-wec-timing; git push origin HEAD:feat/lapsim-wec-timing; }

  collect:
    needs: [f1, wec]
    if: always() && !cancelled() && github.repository == 'kangjeongmin1229/f1-data-analyst-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with: {path: '.cache/action-artifacts'}
      - name: Verify pinned downloads
        run: node scripts/sim/fetch-owner-inputs.mjs
      - name: Replay completed fits, audit and report
        run: node scripts/sim/owner-action-summary.mjs
      - name: Add readable run summary
        if: always()
        run: |
          if test -f owner-summary/handoff-summary.md; then cat owner-summary/handoff-summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-continuation-summary
          path: |
            owner-publish/
            owner-summary/*/report-error.txt
          retention-days: 30
      - name: Save derived results to the PR 154 branch
        if: success()
        run: |
          set -euo pipefail
          tar czf /tmp/owner-results.tgz -C owner-publish .
          cp owner-publish/handoff-summary.md /tmp/owner-summary.md
          git fetch origin feat/lapsim-wec-timing
          git checkout -B owner-result-save FETCH_HEAD
          report_dir="scripts/sim/results/owner-actions-2026-11-11/${GITHUB_RUN_ID}"
          mkdir -p "$report_dir"
          cp /tmp/owner-results.tgz "$report_dir/results.tar.gz"
          cp /tmp/owner-summary.md "$report_dir/README.md"
          sha256sum "$report_dir/results.tar.gz" > "$report_dir/SHA256SUMS"
          cp /tmp/owner-summary.md docs/lapsim-owner-actions-2026-11-11.md
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/lapsim-handoff-physics.md')
          s=p.read_text().replace('All runs have ended; there is no model PR.','The previous local session ended; the latest continuation is linked below. No model is adopted.')
          marker='\n### Owner continuation — 2026-11-11\n'
          s=s.split(marker)[0]+marker+'\nThe owner revised the F1 fold stopping rule. The latest fork-only Actions outcomes, rounds per fold, acceptance checks and unfinished work are in [the continuation report](lapsim-owner-actions-2026-11-11.md). This report supersedes the older Block 2/3 progress above. Completed prior fits were preserved. Production remains unchanged.\n'
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$report_dir" docs/lapsim-owner-actions-2026-11-11.md docs/lapsim-handoff-physics.md
          git commit -m "Save owner continuation results from Actions ${GITHUB_RUN_ID}"
          git push origin HEAD:feat/lapsim-wec-timing || { git pull --rebase origin feat/lapsim-wec-timing; git push origin HEAD:feat/lapsim-wec-timing; }

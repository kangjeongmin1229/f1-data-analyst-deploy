name: LapSim ClA profile (diagnostic)

# claude/status-2026-11-24-wave3-restructure.md: production F1 joint fit (gate B's settings and build) with 2023-25 ClA fixed at
# 6.0-8.0 m² (9 points), everything else refitted. Report only. Output: probe/cla-profile-out.
on:
  push:
    branches: ['probe/cla-profile-2026-11-24']

permissions:
  contents: write
  actions: read

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 290
    strategy:
      fail-fast: false
      matrix:
        cla: ['6.00', '6.25', '6.50', '6.75', '7.00', '7.25', '7.50', '7.75', '8.00']
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lapsim-setup
        with:
          prep-run: '45191678721' # gate B's build
      - name: Joint fit, ClA fixed
        run: |
          set -a; . .github/lapsim-fit.env; set +a
          LAPSIM_SKIP_WEC=1 LAPSIM_CLA_FIX=${{ matrix.cla }} LAPSIM_PART=f1-joint LAPSIM_PARTS_DIR=out/cla-${{ matrix.cla }} node scripts/sim/calibrate.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: cla-${{ matrix.cla }}
          path: out/
          retention-days: 14

  plot:
    needs: fit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cla-*
          path: dl
          merge-multiple: true
      - run: pip install matplotlib
      - run: mkdir -p result && python3 scripts/sim/cla-profile-plot.py dl result > result/summary.json
      - name: Push the result to probe/cla-profile-out
        run: |
          cd result && git init -q -b probe/cla-profile-out && git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898299+github-actions[bot]@users.noreply.github.com' commit -qm "ClA profile, run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe/cla-profile-out

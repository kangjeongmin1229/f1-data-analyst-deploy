name: Probe CarData channels
on:
  push:
    branches: ['probe/**']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache/restore@v4
        with:
          path: .cache/lapsim/raw
          key: lapsim-raw-v1-none
          restore-keys: lapsim-raw-v1-
      - run: node scripts/probe/openf1-keys.mjs
      - run: node scripts/probe/cardata-channels.mjs
        continue-on-error: true

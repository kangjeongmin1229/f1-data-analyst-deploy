name: Lap simulator experiment compare (finished variants only)
# Fork-only helper (Session C, 2026-11-21): the soc-axle run 44857392756 cancelled G and I at the job limit, so its compare job was
# skipped. This compares the finished variants (B, F, H) and commits the text back to this branch.
on:
  push:
    branches: ['lapsim-cmp/**']
permissions:
  contents: write
  actions: read
jobs:
  compare:
    if: github.repository == 'kangjeongmin1229/f1-data-analyst-deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: exp-*
          path: results
          run-id: 44887271869
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compare
        run: |
          mkdir -p comparison
          for v in G; do node scripts/sim/exp-compare.mjs results/exp-B/probe-out/cal-B.js results/exp-$v/probe-out/cal-$v.js | tee comparison/B-vs-$v.txt; done
          for v in B G; do cp results/exp-$v/probe-out/intervals-$v.json results/exp-$v/probe-out/cal-$v.js comparison/ 2>/dev/null || true; done
      - name: Commit result
        run: |
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add comparison && git commit -m "Experiment compare B vs G with calibration files (run 44887271869)" && git push

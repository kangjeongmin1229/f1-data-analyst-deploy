name: Lap simulator experiment compare (finished variants only)
# Fork-only helper (Session C): fetch the A6 refit's calibration-output artifact (run 44914837656, Test failed) into this branch.
on:
  push:
    branches: ['lapsim-cmp/**']
permissions:
  contents: write
  actions: read
jobs:
  compare:
    if: github.repository == 'kangjeongmin1229/f1-data-analyst-deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: calibration-output
          path: comparison
          run-id: 44914837656
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit result
        run: |
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add comparison && git commit -m "A6 calibration output (run 44914837656)" && git push

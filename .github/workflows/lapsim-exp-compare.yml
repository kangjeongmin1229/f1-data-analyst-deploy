name: Lap simulator A6 derived data (fork helper)
# Fork-only helper (Session C, 2026-11-21): A6 run 44858524098 failed one test after the fit, so its derived data was not committed.
# This copies the run's lapsim-derived artifact into this branch so the failure can be reproduced and checked.
on:
  push:
    branches: ['lapsim-cmp/**']
permissions:
  contents: write
  actions: read
jobs:
  copy:
    if: github.repository == 'kangjeongmin1229/f1-data-analyst-deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lapsim-derived
          path: a6-derived
          run-id: 44858524098
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit
        run: |
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          find a6-derived -type f | head -50
          git add a6-derived && git commit -m "A6 derived data from run 44858524098" && git push

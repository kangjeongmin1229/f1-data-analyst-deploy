name: F1 live collector
# Manual only. Since 2026-10 F1 refuses GitHub-hosted runners (CloudFront 403 before
# sign-in, FastF1 #988), so sessions are recorded by a home collector host
# (collector/host_runner.py, docs/home-collector-host.md). This workflow stays for the
# reachability probe (probe=yes) and as a fallback if F1 lifts the block.
# Needs repository secrets F1_USERNAME and F1_PASSWORD (the F1 account for live timing).
on:
  workflow_dispatch:
    inputs:
      history_hours:
        description: 'Look back this many hours for a finished session to publish with FastF1 (default 36)'
        required: false
        default: '36'
      probe:
        description: 'yes = only check whether this runner can reach F1 live timing'
        required: false
        default: 'no'
permissions:
  contents: read
  id-token: write
concurrency:
  group: f1-live-collector
  cancel-in-progress: false
jobs:
  collect:
    # Live timing is switched off (worker/features.js). Set the repository variable
    # LIVE_TIMING_ENABLED to 'true' to run this collector again.
    if: github.repository == 'MisterKinn/f1-data-analyst' && vars.LIVE_TIMING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - name: Install FastF1
        run: pip install fastf1==3.9.0 signalrcore==1.0.2
      - name: Record scheduled session
        working-directory: collector
        env:
          DATA_DIR: ${{ runner.temp }}/f1
          F1_USERNAME: ${{ secrets.F1_USERNAME }}
          F1_PASSWORD: ${{ secrets.F1_PASSWORD }}
          HISTORY_RETRY_HOURS: ${{ inputs.history_hours || '36' }}
          PROBE: ${{ inputs.probe == 'yes' && '1' || '' }}
        run: python actions_runner.py
      - name: Keep run log and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-collector-run-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/f1/run-log.jsonl
            ${{ runner.temp }}/f1/diagnostics/
            ${{ runner.temp }}/f1/snapshot.json
          if-no-files-found: ignore
          retention-days: 30
